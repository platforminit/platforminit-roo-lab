name: 01.1 - Host Bootstrap

on:
  workflow_dispatch:
    inputs:
      project:
        description: PlatformInit project label / logical environment
        required: false
        default: development
      host_name:
        description: Logical host name within the project
        required: false
        default: platforminit-dev-01
      role:
        description: Target host role used for label discovery when host_name is empty
        required: false
        default: primary
      server_id_override:
        description: Optional server ID override
        required: false
        default: ''
      host_ipv4_override:
        description: Optional explicit IPv4 override for break-glass/debug
        required: false
        default: ''

permissions:
  contents: read

env:
  HCLOUD_TOKEN_DEVELOPMENT: ${{ secrets.HCLOUD_TOKEN_DEVELOPMENT }}
  HCLOUD_TOKEN_N8N: ${{ secrets.HCLOUD_TOKEN_N8N }}
  HCLOUD_TOKEN_PLATFORMINIT: ${{ secrets.HCLOUD_TOKEN_PLATFORMINIT }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    environment: ${{ inputs.project || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve target host
        id: server
        uses: ./.github/actions/resolve-target-host
        with:
          infra_server_id: ${{ secrets.INFRA_SERVER_ID }}
          project: ${{ inputs.project || 'development' }}
          host_name: ${{ inputs.host_name || 'platforminit-dev-01' }}
          role: ${{ inputs.role || 'primary' }}
          server_id_override: ${{ inputs.server_id_override }}
          host_ipv4_override: ${{ inputs.host_ipv4_override }}

      - name: Setup SSH key
        env:
          AUTOMATION_SSH_PRIVATE_KEY: ${{ secrets.AUTOMATION_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AUTOMATION_SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Add host key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ steps.server.outputs.public_ip }}" >> ~/.ssh/known_hosts 2>/dev/null
          chmod 600 ~/.ssh/known_hosts

      - name: Upload helper scripts
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
        run: |
          set -euo pipefail
          scp -i ~/.ssh/id_ed25519 platform/host-baseline/scripts/lib-policy.sh root@$HOST:/tmp/platforminit-lib-policy.sh
          scp -i ~/.ssh/id_ed25519 platform/host-baseline/scripts/grant-temporary-sudo.sh root@$HOST:/tmp/platforminit-grant-temporary-sudo.sh
          scp -i ~/.ssh/id_ed25519 platform/host-bootstrap/scripts/sync-host-access.sh root@$HOST:/tmp/platforminit-sync-host-access.sh
          scp -i ~/.ssh/id_ed25519 platform/host-bootstrap/scripts/bootstrap-host-access.sh root@$HOST:/tmp/platforminit-bootstrap-host-access.sh

      - name: Bootstrap users and access
        env:
          HOST: ${{ steps.server.outputs.public_ip }}
          AUTOMATION_SSH_PUBLIC_KEY: ${{ secrets.AUTOMATION_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_ed25519 root@$HOST "AUTOMATION_SSH_PUBLIC_KEY='$AUTOMATION_SSH_PUBLIC_KEY' bash /tmp/platforminit-bootstrap-host-access.sh"
