apiVersion: v1
kind: Namespace
metadata:
  name: demo
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-sysadminhomelab-tls
  namespace: demo
spec:
  secretName: demo-tls
  issuerRef:
    name: letsencrypt-staging
    kind: ClusterIssuer
  dnsNames:
  - demo.sysadminhomelab.hu
