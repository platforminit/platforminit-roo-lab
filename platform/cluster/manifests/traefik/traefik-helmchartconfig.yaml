apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata:
  name: traefik
  namespace: kube-system
spec:
  valuesContent: |-
    service:
      type: LoadBalancer

    # container-level capability only; hostNetwork is intentionally disabled
    securityContext:
      capabilities:
        add:
          - NET_BIND_SERVICE

    ports:
      web:
        port: 80
        expose: true
        exposedPort: 80
      websecure:
        port: 443
        expose: true
        exposedPort: 443

    additionalArguments:
      - "--entrypoints.web.http.redirections.entryPoint.to=websecure"
      - "--entrypoints.web.http.redirections.entryPoint.scheme=https"

    ingressRoute:
      dashboard:
        enabled: false

    logs:
      general:
        level: INFO
      access:
        enabled: true

    ingressClass:
      enabled: true
      isDefaultClass: false
      name: traefik
