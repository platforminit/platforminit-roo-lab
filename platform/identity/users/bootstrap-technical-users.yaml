    "reconcile_mode": "membership-upsert-no-prune",
    "attribute_prefix": "platforminit",
    "contract_version": 2,
    "owner_chapter": "CH04.5",
    "technical_user_creation": "disabled",
    "reconciler": "platform/identity/scripts/ch04-5-bootstrap-identity-model.sh",
