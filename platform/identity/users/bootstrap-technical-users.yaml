      "owner_role": "identity-platform-admins",
      "credential_source": "AUTHENTIK_BOOTSTRAP_PASSWORD",
      "rotation_policy": "operator-managed",
      "groups": [
        "PlatformInit Admins",
        "ArgoCD Admins",
        "Authentik Admins",
        "PlatformInit Operations"
      ]
    }
