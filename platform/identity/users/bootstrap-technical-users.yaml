      "groups": [
        "PlatformInit Operators"
      ]
    },
    {
      "username": "argocd-bootstrap-admin",
      "display_name": "Argo CD Bootstrap Admin",
      "identity_kind": "technical",
      "create_by_default": false,
      "owner_chapter": "CH04.5",
      "owner_role": "argo-cd-platform",
      "purpose": "Temporary Argo CD bootstrap identity until real user/group onboarding is complete.",
      "credential_source": "none-provisioned",
      "rotation_policy": "tracked-task-required",
      "enablement_gate": "requires the tracked CH04.6 onboarding task that retires the bootstrap Argo CD admin path",
      "groups": [
        "ArgoCD Admins"
      ]
    },
    {
      "username": "operations-bootstrap-admin",
      "display_name": "Operations Bootstrap Admin",
      "identity_kind": "technical",
      "create_by_default": false,
      "owner_chapter": "CH04.5",
      "owner_role": "operations-platform",
      "purpose": "Temporary CH05 operations bootstrap identity until real user/group onboarding is complete.",
      "credential_source": "none-provisioned",
      "rotation_policy": "tracked-task-required",
      "enablement_gate": "requires the tracked CH05 onboarding task that retires the bootstrap operations admin path",
      "groups": [
        "PlatformInit Operations"
      ]
    }
