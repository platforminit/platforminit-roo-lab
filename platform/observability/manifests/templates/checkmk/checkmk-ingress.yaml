apiVersion: v1
kind: Service
metadata:
  name: authentik-forward-auth
  namespace: operations
  labels:
    app.kubernetes.io/name: checkmk
    app.kubernetes.io/part-of: platforminit-operations
spec:
  type: ExternalName
  externalName: {{ .Values.authentik.embeddedOutpostService }}.{{ .Values.authentik.namespace }}.svc.cluster.local
  ports:
    - name: http
      port: {{ .Values.authentik.embeddedOutpostPort }}
      targetPort: {{ .Values.authentik.embeddedOutpostPort }}
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: checkmk-authentik-forward-auth
  namespace: operations
  labels:
    app.kubernetes.io/name: checkmk
    app.kubernetes.io/part-of: platforminit-operations
spec:
  forwardAuth:
    address: "http://authentik-forward-auth.operations.svc.cluster.local:{{ .Values.authentik.embeddedOutpostPort }}/outpost.goauthentik.io/auth/traefik"
    trustForwardHeader: true
    authResponseHeaders:
      - X-authentik-username
      - X-authentik-groups
      - X-authentik-entitlements
      - X-authentik-email
      - X-authentik-name
      - X-authentik-uid
      - X-authentik-jwt
      - X-authentik-meta-jwks
      - X-authentik-meta-outpost
      - X-authentik-meta-provider
      - X-authentik-meta-app
      - X-authentik-meta-version
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: checkmk-authentik-logout-redirect
  namespace: operations
  labels:
    app.kubernetes.io/name: checkmk
    app.kubernetes.io/part-of: platforminit-operations
spec:
  redirectRegex:
    regex: '^https?://[^/]+/cmk/(check_mk/)?logout\.py(\?.*)?$'
    replacement: 'https://auth.{{ .Values.baseDomain }}/if/flow/default-invalidation-flow/'
    permanent: false
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: checkmk-tls
  namespace: operations
  labels:
    app.kubernetes.io/name: checkmk
    app.kubernetes.io/part-of: platforminit-operations
spec:
  secretName: checkmk-tls
  issuerRef:
    name: {{ .Values.tlsIssuer | quote }}
    kind: ClusterIssuer
  dnsNames:
    - "checkmk.{{ .Values.baseDomain }}"
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: checkmk
  namespace: operations
  labels:
    app.kubernetes.io/name: checkmk
    app.kubernetes.io/part-of: platforminit-operations
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: "Host(`checkmk.{{ .Values.baseDomain }}`) && (Path(`/cmk/check_mk/logout.py`) || Path(`/cmk/logout.py`))"
      priority: 30
      middlewares:
        - name: checkmk-authentik-logout-redirect
          namespace: operations
      services:
        - kind: Service
          name: authentik-forward-auth
          port: {{ .Values.authentik.embeddedOutpostPort }}
    - kind: Rule
      match: "Host(`checkmk.{{ .Values.baseDomain }}`) && PathPrefix(`/outpost.goauthentik.io/`)"
      priority: 20
      services:
        - kind: Service
          name: authentik-forward-auth
          port: {{ .Values.authentik.embeddedOutpostPort }}
    - kind: Rule
      match: "Host(`checkmk.{{ .Values.baseDomain }}`)"
      priority: 10
      middlewares:
        - name: checkmk-authentik-forward-auth
          namespace: operations
      services:
        - name: checkmk
          port: 80
  tls:
    secretName: checkmk-tls
