# Current example — n8n project registry entry.
# server_prefix + default server index (-01) currently derives platforminit-n8n-01.
# This is a resolver-derived value, not a permanent invariant.
project_id: n8n
hetzner:
  token_secret: HCLOUD_TOKEN_N8N
  region: hel1
  server_prefix: platforminit-n8n
  default_server_type: cx23
ssh:
  key_name: platforminit-n8n-automation
volumes:
  namespace: platforminit-n8n
  layout: none
