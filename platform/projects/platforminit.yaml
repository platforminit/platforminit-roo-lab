# Current example — platforminit project registry entry (production scope).
# server_prefix + default server index (-01) currently derives platforminit-prod-01.
# This is a resolver-derived value, not a permanent invariant.
project_id: platforminit
hetzner:
  token_secret: HCLOUD_TOKEN_PLATFORMINIT
  region: hel1
  server_prefix: platforminit-prod
ssh:
  key_name: platforminit-platforminit-automation
volumes:
  namespace: platforminit-platforminit
  layout: split
